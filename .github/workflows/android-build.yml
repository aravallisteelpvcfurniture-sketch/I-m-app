name: Build Aravalli Steel Android APK & Deploy GitHub Pages

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for Gradle wrapper
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            echo "gradlew execute permission granted."
          else
            echo "ERROR: gradlew not found in repository root!"
            exit 1
          fi

      - name: Setup Keystore, Environment & Google Services
        run: |
          echo "=== Setting up Build Environment ==="

          # 1. Restore debug.keystore from base64 if present, or generate one
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ -f debug.keystore ]; then
            echo "debug.keystore ready ($(wc -c < debug.keystore) bytes)"
          else
            echo "ERROR: debug.keystore could not be restored or created!"
            exit 1
          fi

          # 2. Ensure google-services.json is present in app/
          if [ ! -f app/google-services.json ]; then
            echo "Creating fallback google-services.json for CI..."
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "584333364172",
              "firebase_url": "https://aravallisteel-60c94-default-rtdb.firebaseio.com",
              "project_id": "aravallisteel-60c94",
              "storage_bucket": "aravallisteel-60c94.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:584333364172:android:c5ce0f5f6eadebd12d2b69",
                  "android_client_info": {
                    "package_name": "com.aravalli.steelpvcfurniture"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "584333364172-7rdinqqt7cjnilj83qj7kka17t2fuj7b.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyAHTQE3sWrw53uAKjHCmxX_JOgvCjNWlDY"
                  }
                ],
                "services": {}
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:584333364172:android:c5ce0f5f6eadebd12d2b69",
                  "android_client_info": {
                    "package_name": "Com.aravalli.my"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "584333364172-7rdinqqt7cjnilj83qj7kka17t2fuj7b.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyAHTQE3sWrw53uAKjHCmxX_JOgvCjNWlDY"
                  }
                ],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

          # 3. Ensure .env exists with placeholder or secret
          if [ ! -f .env ]; then
            echo "Copying .env from .env.example..."
            cp .env.example .env
          fi

      - name: Build Debug APK
        env:
          JAVA_OPTS: "-Djava.awt.headless=true"
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify Debug APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: Expected APK at $APK_PATH does not exist or is empty!"
            exit 1
          fi
          echo "SUCCESS: Debug APK generated: $(ls -lh $APK_PATH)"

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AravalliSteelPvCFurniture-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare GitHub Pages Site
        if: success()
        run: |
          mkdir -p site
          cp docs/index.html site/index.html
          cp app/build/outputs/apk/debug/app-debug.apk site/app-debug.apk
          mkdir -p docs
          cp app/build/outputs/apk/debug/app-debug.apk docs/app-debug.apk
          echo "Site prepared for GitHub Pages:"
          ls -lh site/

      - name: Upload GitHub Pages Artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Diagnostics on Failure
        if: failure()
        run: |
          echo "=== BUILD DIAGNOSTICS ==="
          echo "Java version:"
          java -version || true
          echo "Available memory:"
          free -h || true
          echo "Gradle wrapper check:"
          ls -la gradlew gradle/wrapper/ || true
          echo "Key files check:"
          ls -la debug.keystore app/google-services.json .env || true

  deploy-pages:
    name: Deploy APK Download Site to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
